name: 打包 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: gradle/actions/setup-gradle@v4

      # Jack 专用代理的内核：从 sing-box 源码只编译需要的协议（官方安卓版 80MB，这样 40MB），放进 jniLibs
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      - uses: actions/cache@v4
        id: singbox
        with:
          path: app/src/main/jniLibs/arm64-v8a/libsingbox.so
          key: singbox-v1.14.3-quic-utls

      - name: Build proxy core
        if: steps.singbox.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b v1.14.3 https://github.com/SagerNet/sing-box /tmp/sing-box
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd /tmp/sing-box
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -tags with_quic,with_utls \
            -ldflags "-s -w -buildid=" -o $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libsingbox.so ./cmd/sing-box

      # 版本名：第 100 次打包起是 v1.1.0、v1.1.1……（和 app/build.gradle.kts、Updater 里的 100 一致）
      - name: Version
        run: |
          n=${{ github.run_number }}
          if [ "$n" -ge 100 ]; then echo "VERSION=1.1.$((n - 100))" >> "$GITHUB_ENV"; else echo "VERSION=1.0.$n" >> "$GITHUB_ENV"; fi

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          # 出错时把关键报错写成注释，方便在网页上直接看到
          ./gradlew assembleRelease 2>&1 | tee build.log || {
            grep -E "^e: |What went wrong|error:" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk JackAI-v${{ env.VERSION }}.apk

      - name: Check Office files
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest --tests "com.jack.ai.*" 2>&1 | tee test.log || {
            grep -E "^e: |What went wrong|Exception|FAILED" -A3 test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          pip install -q python-docx python-pptx openpyxl
          python scripts/check_office.py app/build/office-samples

      - uses: actions/upload-artifact@v4
        with:
          name: office-samples
          path: app/build/office-samples

      - uses: actions/upload-artifact@v4
        with:
          name: JackAI-apk
          path: JackAI-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Jack AI v${{ env.VERSION }}
          make_latest: true
          body: |
            在手机上点下面的 JackAI-v${{ env.VERSION }}.apk 下载并安装。
            以后有新版本直接覆盖安装，聊天记录不会丢。
          files: JackAI-*.apk
