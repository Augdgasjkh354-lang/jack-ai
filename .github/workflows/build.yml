name: 打包 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          # 出错时把关键报错写成注释，方便在网页上直接看到
          ./gradlew assembleRelease 2>&1 | tee build.log || {
            grep -E "^e: |What went wrong|error:" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk JackAI-v1.0.${{ github.run_number }}.apk

      - name: Check Office files
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest --tests "com.jack.ai.*" 2>&1 | tee test.log || {
            grep -E "^e: |What went wrong|Exception|FAILED" -A3 test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          pip install -q python-docx python-pptx openpyxl
          python scripts/check_office.py app/build/office-samples

      - uses: actions/upload-artifact@v4
        with:
          name: office-samples
          path: app/build/office-samples

      - uses: actions/upload-artifact@v4
        with:
          name: JackAI-apk
          path: JackAI-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Jack AI v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            在手机上点下面的 JackAI-v1.0.${{ github.run_number }}.apk 下载并安装。
            以后有新版本直接覆盖安装，聊天记录不会丢。
          files: JackAI-*.apk
