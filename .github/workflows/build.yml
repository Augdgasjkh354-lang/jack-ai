name: 打包 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 默认会把 token 留给后面步骤的 git 用；打包步骤不需要推代码，不留
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: gradle/actions/setup-gradle@v4

      # Kavi 专用代理的内核：从 sing-box 源码只编译需要的协议（官方安卓版 80MB，这样 40MB），放进 jniLibs
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      - uses: actions/cache@v4
        id: singbox
        with:
          path: app/src/main/jniLibs/arm64-v8a/libsingbox.so
          key: singbox-v1.14.3-quic-utls

      - name: Build proxy core
        if: steps.singbox.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b v1.14.3 https://github.com/SagerNet/sing-box /tmp/sing-box
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd /tmp/sing-box
          # 锁死在 v1.14.3 那次提交：标签被改过就不编（和下面 hev 的做法一样）
          test "$(git rev-parse HEAD)" = "7054cac5124465ffdb145870d7c01885566711b1"
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -tags with_quic,with_utls \
            -ldflags "-s -w -buildid=" -o $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libsingbox.so ./cmd/sing-box

      # 按 App 分流用的转发组件（把系统 VPN 收到的流量交给代理内核）：从 hev-socks5-tunnel 源码编译成 .so。
      # 组件按「com/jack/ai/vpn/TProxyService」注册方法，要和 App 里的类对上。编不出来也不挡打包，App 里这个功能会显示「这一版没带上」
      - uses: actions/cache@v4
        id: hev
        with:
          path: app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          key: hev-socks5-tunnel-2.18.0-com.jack.ai.vpn

      - name: Build tunnel
        if: steps.hev.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git clone --depth 1 -b 2.18.0 --recursive --shallow-submodules https://github.com/heiher/hev-socks5-tunnel /tmp/hev
          cd /tmp/hev
          # 锁死在 2.18.0 那次提交：标签被改过就不编
          test "$(git rev-parse HEAD)" = "d9dca26c7ad0e494492244f0309e80ee583e739e"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          "$NDK/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk \
            APP_ABI=arm64-v8a "APP_CFLAGS=-O3 -DPKGNAME=com/jack/ai/vpn -DCLSNAME=TProxyService" -j4
          mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
          cp libs/arm64-v8a/libhev-socks5-tunnel.so $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/

      # 版本名：第 100 次打包起是 v1.1.0、v1.1.1……（和 app/build.gradle.kts、Updater 里的 100 一致）
      - name: Version
        run: |
          n=${{ github.run_number }}
          if [ "$n" -ge 100 ]; then echo "VERSION=1.1.$((n - 100))" >> "$GITHUB_ENV"; else echo "VERSION=1.0.$n" >> "$GITHUB_ENV"; fi

      # 签名密钥从 Secrets 还原到仓库外面的临时目录，打完包就随机器一起销毁；缺了就不打包，免得发出签名不对、装不上的包
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KAVI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KAVI_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::缺少签名密钥：在仓库 Settings → Secrets and variables → Actions 里加 KAVI_KEYSTORE_BASE64 和 KAVI_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kavi.keystore"
          echo "KAVI_KEYSTORE_FILE=$RUNNER_TEMP/kavi.keystore" >> "$GITHUB_ENV"
          echo "KAVI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          # 出错时把关键报错写成注释，方便在网页上直接看到
          ./gradlew assembleRelease 2>&1 | tee build.log || {
            grep -E "^e: |What went wrong|error:" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk Kavi-v${{ env.VERSION }}.apk

      - name: Check Office files
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest --tests "com.jack.ai.*" 2>&1 | tee test.log || {
            grep -E "^e: |What went wrong|Exception|FAILED" -A3 test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          pip install -q python-docx==1.2.0 python-pptx==1.0.2 openpyxl==3.1.5
          python scripts/check_office.py app/build/office-samples

      - uses: actions/upload-artifact@v4
        with:
          name: office-samples
          path: app/build/office-samples

      - uses: actions/upload-artifact@v4
        with:
          name: Kavi-apk
          path: Kavi-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Kavi v${{ env.VERSION }}
          make_latest: true
          body: |
            在手机上点下面的 Kavi-v${{ env.VERSION }}.apk 下载并安装。
            以后有新版本直接覆盖安装，聊天记录不会丢。
          files: Kavi-*.apk
