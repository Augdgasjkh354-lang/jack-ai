<title>竖版海报·大字报活动</title>
<style>
*{box-sizing:border-box}
.canvas *{text-wrap:pretty}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
.canvas{--bg:#FFE24A;--fg:#141414;--primary:#141414;--secondary:#FFFFFF;--accent:#D92B22;--muted:#4A4220;
  --font-title:"Smiley Sans","Noto Sans CJK SC",sans-serif;--font-sans:"Noto Sans SC","Noto Sans CJK SC",sans-serif;--font-num:"Bebas Neue","Smiley Sans",sans-serif;
  position:relative;width:1080px;height:1920px;overflow:hidden;padding:76px 80px 72px;display:flex;flex-direction:column;
  background:var(--bg);color:var(--fg);font-family:var(--font-sans)}
/* 颗粒：让纯色底不那么「电脑味」 */
.grain{position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:multiply}
.bignum{position:absolute;z-index:1;right:-30px;bottom:340px;font-family:var(--font-num);font-size:560px;line-height:.8;color:transparent;-webkit-text-stroke:6px var(--fg);opacity:.9}
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;height:72px}
.tag{display:inline-block;padding:10px 26px 12px;background:var(--fg);color:var(--bg);font-family:var(--font-title);font-size:40px;line-height:1;transform:rotate(-3deg);box-shadow:6px 6px 0 var(--accent)}
.nov{font-family:var(--font-num);font-size:44px;letter-spacing:.08em;color:var(--fg)}
.hero{position:relative;z-index:2;margin-top:64px}
.title{margin:0;font-family:var(--font-title);font-weight:400;font-size:200px;line-height:1.02;letter-spacing:-.01em;color:var(--primary)}
.subtitle{position:relative;z-index:2;margin-top:40px;max-width:800px;font-size:38px;line-height:1.45;font-weight:500;color:var(--muted)}
.dateblock{position:relative;z-index:2;margin-top:56px;padding:40px 48px 44px;background:var(--secondary);border:5px solid var(--fg);box-shadow:14px 14px 0 var(--accent)}
.datelabel{display:block;font-size:28px;font-weight:700;letter-spacing:.2em;color:var(--fg)}
.date{display:block;margin-top:14px;font-family:var(--font-title);font-size:80px;line-height:1.12;color:var(--fg)}
.time{display:block;margin-top:16px;font-size:40px;line-height:1.2;font-weight:700;color:var(--fg)}
.info{position:relative;z-index:2;margin-top:48px;display:flex;flex-direction:column;gap:26px}
.row{display:flex;align-items:center;gap:20px}
.chip{flex:none;padding:8px 16px;background:var(--fg);color:var(--bg);font-size:30px;font-weight:700;line-height:1.2}
.row .place,.row .contact{font-size:36px;line-height:1.3;font-weight:500;color:var(--fg)}
.bottom{position:relative;z-index:2;margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:28px;border-top:5px solid var(--fg)}
.footer{font-size:30px;font-weight:700;color:var(--fg)}
.free{display:inline-block;padding:8px 22px 10px;background:var(--fg);color:var(--bg);font-family:var(--font-title);font-size:34px;line-height:1;transform:rotate(2deg)}
:where(span[data-slot]){display:inline-block}
</style>
</head>
