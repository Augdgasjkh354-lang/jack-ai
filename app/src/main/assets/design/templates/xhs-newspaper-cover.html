<title>报纸·封面</title>
<style>
*{box-sizing:border-box}
.canvas *{text-wrap:pretty}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden}
.canvas{--bg:#F1ECE1;--fg:#161412;--primary:#161412;--secondary:#E0D8C8;--accent:#C4302B;--muted:#5E5850;
  --font-title:"Noto Serif SC","Noto Serif CJK SC",serif;--font-sans:"Noto Serif SC","Noto Serif CJK SC",serif;--font-num:"Playfair Display","Noto Serif SC",serif;
  position:relative;width:1080px;height:1440px;overflow:hidden;padding:72px 76px;display:flex;flex-direction:column;
  background:var(--bg);color:var(--fg);font-family:var(--font-sans)}
/* 颗粒：让纯色底不那么「电脑味」 */
.grain{position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:multiply}
.masthead{position:relative;text-align:center}
.mast-en{font-family:var(--font-num);font-size:26px;font-weight:700;letter-spacing:.35em;color:var(--muted)}
.name{display:block;margin-top:10px;font-family:var(--font-title);font-weight:900;font-size:118px;line-height:1.05;letter-spacing:.06em;color:var(--fg)}
.dateline{position:relative;display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;padding:14px 0;border-top:2px solid var(--fg);border-bottom:2px solid var(--fg)}
.dateline span{font-size:26px;font-weight:700}
.rule-double{position:relative;height:16px;margin-top:18px;border-top:6px solid var(--fg);border-bottom:2px solid var(--fg)}
.tagrow{position:relative;display:flex;align-items:center;gap:16px;margin-top:26px}
.sq{width:16px;height:16px;background:var(--accent);flex:none}
.tag{font-size:28px;font-weight:700;letter-spacing:.22em;color:var(--accent)}
.title{position:relative;margin:18px 0 0;font-family:var(--font-title);font-weight:900;font-size:100px;line-height:1.12;color:var(--fg)}
.subtitle{position:relative;margin-top:20px;font-size:28px;line-height:1.5;color:var(--muted)}
.photo{position:relative;margin-top:26px;height:320px;border:2px solid var(--fg);background-color:var(--secondary);background-image:radial-gradient(color-mix(in srgb, var(--fg) 22%, transparent) 1.6px, transparent 2.4px);background-size:14px 14px}
.caption{position:relative;margin-top:14px;font-size:24px;line-height:1.4;color:var(--muted)}
.body{position:relative;margin-top:20px;font-size:28px;line-height:1.7;color:var(--fg)}
.body::first-letter{font-size:66px;font-weight:900;line-height:1;float:left;padding:8px 14px 0 0}
.bottom{position:relative;margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;padding-top:20px;border-top:2px solid var(--fg)}
.author{font-size:28px;font-weight:700}
.page{font-family:var(--font-num);font-size:30px;font-weight:700}
:where(span[data-slot]){display:inline-block}
</style>
</head>

    <span class="author" data-slot="author" data-max="12">@你的账号</span>

</div>
