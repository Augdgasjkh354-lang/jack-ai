<title>国风·清单</title>
<style>
*{box-sizing:border-box}
.canvas *{text-wrap:pretty}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden}
.canvas{--bg:#F3ECDD;--fg:#231C16;--primary:#B83A2B;--secondary:#E4D8C0;--accent:#2E4F4A;--muted:#6D6253;

/* 颗粒：让纯色底不那么「电脑味」 */
.grain{position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:multiply}
.frame{position:absolute;inset:34px;border:2px solid var(--muted);opacity:.5;pointer-events:none}

.top{position:relative;display:flex;align-items:center;justify-content:space-between;height:56px}
.tag{font-size:32px;font-weight:700;letter-spacing:.14em;color:var(--primary);padding-bottom:10px;border-bottom:3px solid var(--primary)}
.page{font-size:32px;font-weight:700;letter-spacing:.1em}
.title-row{position:relative;display:flex;align-items:center;gap:22px;margin-top:36px}
.title{margin:0;font-family:var(--font-title);font-weight:400;font-size:88px;line-height:1.1;color:var(--fg)}
.seal-sm{flex:none;display:grid;grid-template-columns:1fr 1fr;width:76px;height:76px;padding:9px;background:var(--primary);color:var(--bg);font-family:var(--font-title);font-weight:400;font-size:28px;line-height:1;text-align:center}
.intro{position:relative;margin-top:18px;font-size:30px;color:var(--muted)}
.items{position:relative;margin-top:34px;border-top:2px solid var(--fg)}
.item{display:grid;grid-template-columns:96px 1fr;column-gap:28px;padding:18px 0;border-bottom:1px solid var(--muted)}
.num{font-size:48px;font-weight:700;line-height:1;color:var(--primary);padding-top:4px}
.head{display:block;font-size:38px;font-weight:700;line-height:1.26}
.text{display:block;margin-top:8px;font-size:28px;line-height:1.45;color:var(--muted)}
.note{position:relative;margin-top:auto;display:flex;align-items:center;gap:16px;padding-top:28px}
.sq{flex:none;width:16px;height:16px;background:var(--primary)}
.note-text{font-size:30px;font-weight:700}
:where(span[data-slot]){display:inline-block}
</style>
</head>
