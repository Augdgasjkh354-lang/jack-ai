<title>科技暗色·数据</title>
<style>
*{box-sizing:border-box}
.canvas *{text-wrap:pretty}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden}
.canvas{--bg:#0E0F0C;--fg:#EDEEE8;--primary:#B6F23D;--secondary:#1C1E19;--accent:#5AD1FF;--muted:#A3A69C;
  --font-title:"Noto Sans SC","Noto Sans CJK SC",sans-serif;--font-sans:"Noto Sans SC","Noto Sans CJK SC",sans-serif;--font-num:"Space Grotesk","Noto Sans SC",sans-serif;
  position:relative;width:1080px;height:1440px;overflow:hidden;padding:76px 80px 72px;display:flex;flex-direction:column;
  background:var(--bg);color:var(--fg);font-family:var(--font-sans)}
.grid{position:absolute;inset:0;pointer-events:none}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:screen}
.top{position:relative;display:flex;align-items:center;justify-content:space-between;height:60px}
.topleft{display:flex;align-items:center;gap:16px}
.code{font-family:var(--font-num);font-size:20px;font-weight:700;letter-spacing:.3em;color:var(--primary)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tag{display:inline-block;padding:10px 22px 12px;border:1px solid var(--primary);color:var(--primary);font-size:30px;font-weight:700;letter-spacing:.08em}
.page{font-family:var(--font-num);font-size:32px;font-weight:700;letter-spacing:.12em;color:var(--fg)}
.title{position:relative;margin:44px 0 0;font-family:var(--font-title);font-weight:900;font-size:84px;line-height:1.05;color:var(--fg)}
.hero{position:relative;margin-top:40px}
.big{display:block;font-family:var(--font-num);font-weight:700;font-size:220px;line-height:1;color:var(--primary)}
.biglabel{display:block;margin-top:18px;font-size:32px;font-weight:700;color:var(--fg)}
.meter{position:relative;margin-top:28px;height:10px;background:rgba(255,255,255,.12)}
.fill{width:89%;height:100%;background:var(--primary)}
.ticks{position:relative;display:flex;justify-content:space-between;margin-top:8px;font-family:var(--font-num);font-size:20px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.stats{position:relative;margin-top:36px;border-top:1px solid rgba(255,255,255,.18)}
.stat{display:grid;grid-template-columns:300px 1fr;column-gap:28px;align-items:center;padding:26px 0;border-bottom:1px solid rgba(255,255,255,.18)}
.value{font-family:var(--font-num);font-weight:700;font-size:56px;line-height:1;color:var(--primary)}
.statbody{min-width:0}
.statlabel{display:block;font-size:30px;line-height:1.3;font-weight:700;color:var(--fg)}
.stattext{display:block;margin-top:8px;font-size:26px;line-height:1.5;font-weight:400;color:var(--muted)}
.foot{position:relative;margin-top:auto;display:flex;align-items:center;gap:16px;padding-top:24px;border-top:1px solid rgba(255,255,255,.25);font-size:26px;font-weight:500;color:var(--fg)}
.foot i{width:30px;height:30px;flex:none}
:where(span[data-slot]){display:inline-block}
</style>
</head>

    </div>

    </div>
  </div>

</div>
