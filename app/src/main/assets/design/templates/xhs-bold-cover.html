<title>大字报·封面</title>
<style>
*{box-sizing:border-box}
.canvas *{text-wrap:pretty}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden}
.canvas{--bg:#FFE24A;--fg:#141414;--primary:#141414;--secondary:#FFFFFF;--accent:#D92B22;--muted:#4A4220;
  --font-title:"Smiley Sans","Noto Sans CJK SC",sans-serif;--font-sans:"Noto Sans SC","Noto Sans CJK SC",sans-serif;--font-num:"Bebas Neue","Smiley Sans",sans-serif;
  position:relative;width:1080px;height:1440px;overflow:hidden;padding:76px 80px 72px;display:flex;flex-direction:column;
  background:var(--bg);color:var(--fg);font-family:var(--font-sans)}
/* 颗粒：让纯色底不那么「电脑味」 */
.grain{position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:multiply}
.top{position:relative;display:flex;align-items:center;justify-content:space-between;height:72px}
.tag{display:inline-block;padding:10px 26px 12px;background:var(--fg);color:var(--bg);font-family:var(--font-title);font-size:40px;line-height:1;transform:rotate(-3deg);box-shadow:6px 6px 0 var(--accent)}
.page{font-family:var(--font-num);font-size:40px;letter-spacing:.06em;color:var(--fg)}
.hero{position:relative;z-index:2;margin-top:96px}
.title{margin:0;font-family:var(--font-title);font-weight:400;font-size:178px;line-height:1.02;letter-spacing:-.01em;color:var(--primary)}
.keyword{display:inline-block;margin-top:26px;padding:6px 30px 14px;background:var(--fg);color:var(--bg);font-family:var(--font-title);font-size:150px;line-height:1.02;transform:rotate(-2deg);box-shadow:12px 12px 0 var(--accent)}
.subtitle{position:relative;z-index:2;margin-top:58px;max-width:760px;font-size:40px;line-height:1.45;font-weight:500;color:var(--muted)}
.number{position:absolute;z-index:1;right:-30px;bottom:190px;font-family:var(--font-num);font-size:600px;line-height:.8;color:transparent;-webkit-text-stroke:6px var(--fg);opacity:.9}
.bottom{position:relative;z-index:2;margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:28px;border-top:5px solid var(--fg)}
.author{font-size:30px;font-weight:700;letter-spacing:.02em}
.next{display:flex;align-items:center;gap:14px;font-family:var(--font-title);font-size:38px}
.next svg{width:64px;height:30px}
:where(span[data-slot]){display:inline-block}
</style>
</head>
<body>
