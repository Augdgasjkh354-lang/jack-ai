<style>

.canvas{--bg:#111111;--fg:#F2EBDD;--primary:#C8A464;--secondary:#1F1D1A;--accent:#E6D3A8;--muted:#ADA594;

.dia{flex:none;width:10px;height:10px;background:var(--primary);transform:rotate(45deg)}
